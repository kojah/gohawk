version: "2"

formatters:
  enable:
    - gofumpt

linters:
  default: standard
  enable:
    - bidichk
    - contextcheck
    - copyloopvar
    - cyclop
    - dupl
    - dupword
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - gocritic
    - godoclint
    - goprintffuncname
    - gosec
    - interfacebloat
    - intrange
    - lll
    - makezero
    - misspell
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - noctx
    - nestif
    - nolintlint
    - perfsprint
    - reassign
    - recvcheck
    - revive
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usetesting
    - usestdlibvars
    - wastedassign
  settings:
    cyclop:
      max-complexity: 20
    dupl:
      # The default 150-token threshold hides the duplication that actually
      # recurs here: copied SSA traversal walkers, forward worklists, and
      # guarded trace-emit wrappers. Sixty tokens surfaces them so the
      # mechanics get extracted into shared helpers rather than re-copied.
      threshold: 60
    exhaustive:
      # Analyzer switches intentionally use conservative default branches for
      # tokens and syntax added by future Go releases.
      default-signifies-exhaustive: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: Return an error from reusable code instead of panicking.
        - pattern: ^log\.Fatal(f|ln)?$
          msg: Return an error and let the command entry point choose the exit status.
        - pattern: ^os\.Exit$
          msg: Return an exit status from reusable code instead of terminating the process.
    funlen:
      lines: 100
      statements: 60
      ignore-comments: true
    gocognit:
      min-complexity: 40
    lll:
      line-length: 160
      tab-width: 4
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: argument-limit
          arguments: [8]
        - name: file-length-limit
          arguments:
            - max: 500
              skip-comments: true
              skip-blank-lines: true
  exclusions:
    rules:
      # Test fixtures intentionally execute variable commands and create
      # ordinary repository files and directories.
      - path: _test\.go
        linters:
          - gosec
      # These command boundaries intentionally execute the current gohawk
      # process or a command supplied by the measurement caller.
      - path: ^(internal/cli/output|tools/measure/main)\.go$
        text: "G(204|702):"
        linters:
          - gosec
      # The catalog is declaration data: one entry per check, each naming an
      # identity, a description, a kind, and a tier. Two analyzers with the
      # same number of checks are structurally identical by construction, and
      # the repetition is the point -- every check is declared the same way.
      # Extracting a helper would hide the metadata the catalog exists to show.
      - path: ^analyzers/catalog_specs\.go$
        linters:
          - dupl
      # Documentation tooling reads discovered source paths and writes
      # shareable repository assets with ordinary directory/file modes.
      - path: ^tools/gendocs/(main|synchronize|development)\.go$
        text: "G30(1|4|6):"
        linters:
          - gosec
      - path: ^internal/docexamples/examples\.go$
        text: "G(122|304):"
        linters:
          - gosec
      # Applying a suggested fix reads and rewrites the source files the user
      # asked to fix, with the ordinary source file mode.
      - path: ^internal/cli/fix\.go$
        text: "G30(4|6):"
        linters:
          - gosec
      # Commit-pinned evidence links are intentionally kept intact.
      - source: '^\s*// https?://'
        linters:
          - lll
      # Executable entry points own process termination by design.
      - path: '^(main\.go|tools/.*/main\.go)$'
        linters:
          - forbidigo
