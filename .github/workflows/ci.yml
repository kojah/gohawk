name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Run fast static checks and Hyrule contracts
        run: make verify-static

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Run golangci-lint
        run: make lint

  vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Check reachable dependencies for vulnerabilities
        run: make vuln

  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Build and dogfood gohawk
        run: make dogfood

  race:
    name: targeted race tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Run race-enabled tests
        run: make test-race

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Test the golangci-lint plugin
        run: make plugin-test

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Collect coverage
        # Measure product analysis behavior, not CLI and documentation tooling.
        run: make coverage

      - name: Upload coverage receipts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.out

  # The badge is data, not committed text: this job publishes a shields.io
  # endpoint document to the badges branch after coverage lands on main.
  # Pull requests never fail because the committed badge is stale. README reads
  # it through jsDelivr, which caches branches for up to 12 hours.
  publish-badge:
    name: publish coverage badge
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@v7
        with:
          name: coverage

      - name: Publish badge endpoint document
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          percentage=$(awk '/^total:/ {gsub("%", "", $NF); print $NF}' coverage-summary.out)
          test -n "$percentage"
          color=$(awk -v p="$percentage" 'BEGIN {
            if (p >= 90) print "brightgreen";
            else if (p >= 85) print "green";
            else if (p >= 80) print "yellowgreen";
            else if (p >= 70) print "yellow";
            else if (p >= 60) print "orange";
            else print "red";
          }')
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$percentage" "$color" > coverage.json
          git init -q badge
          cp coverage.json badge/
          cd badge
          git checkout -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update coverage badge to ${percentage}%"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  compatibility:
    name: compatibility (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', '1.27']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up build toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Build compatibility binary
        run: go build -o "$RUNNER_TEMP/gohawk" .

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: "${{ matrix.go-version }}.x"
          cache: false

      - name: Analyze with Go ${{ matrix.go-version }}
        run: scripts/test-toolchain-compatibility.sh "$RUNNER_TEMP/gohawk" "${{ matrix.go-version }}"

  exhaustive-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Run exhaustive CLI subprocess matrix
        run: make test-exhaustive

  skills:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check installed skill revisions
        env:
          GH_TOKEN: ${{ secrets.SKILL_VAULT_TOKEN }}
        run: make skills-check

  # Preserve the existing aggregate check name while the expensive verification
  # work runs concurrently in the jobs above.
  test:
    if: ${{ always() }}
    needs: [static-fast, lint, vulnerability, dogfood, race, plugin, coverage, compatibility, exhaustive-cli, skills]
    runs-on: ubuntu-latest
    steps:
      - name: Check verification results
        env:
          STATIC_FAST_RESULT: ${{ needs.static-fast.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
          DOGFOOD_RESULT: ${{ needs.dogfood.result }}
          RACE_RESULT: ${{ needs.race.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          EXHAUSTIVE_CLI_RESULT: ${{ needs.exhaustive-cli.result }}
          SKILLS_RESULT: ${{ needs.skills.result }}
        run: |
          for result in "$STATIC_FAST_RESULT" "$LINT_RESULT" "$VULNERABILITY_RESULT" "$DOGFOOD_RESULT" "$RACE_RESULT" "$PLUGIN_RESULT" "$COVERAGE_RESULT" "$COMPATIBILITY_RESULT" "$EXHAUSTIVE_CLI_RESULT"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
          if [[ "$SKILLS_RESULT" != "success" && "$SKILLS_RESULT" != "skipped" ]]; then
            exit 1
          fi
