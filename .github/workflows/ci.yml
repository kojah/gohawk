name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run fast static checks
        run: make verify-static

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        run: make lint

  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build and dogfood gohawk
        run: make dogfood

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run race-enabled tests
        run: make test-race

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test the golangci-lint plugin
        run: make plugin-test

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Collect coverage
        # Measure product analysis behavior, not CLI and documentation tooling.
        run: make coverage

      - name: Generate coverage badge
        uses: tj-actions/coverage-badge-go@481919ec72da287775fef015fd9011dc75a5db05 # v3
        with:
          filename: coverage-summary.out
          link: https://github.com/kojah/gohawk/actions/workflows/ci.yml

      - name: Check coverage badge
        run: git diff --exit-code -- README.md

  compatibility:
    name: compatibility (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', '1.27']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up build toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build compatibility binary
        run: go build -o "$RUNNER_TEMP/gohawk" .

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: "${{ matrix.go-version }}.x"
          cache: false

      - name: Analyze with Go ${{ matrix.go-version }}
        run: scripts/test-toolchain-compatibility.sh "$RUNNER_TEMP/gohawk" "${{ matrix.go-version }}"

  skills:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check installed skill revisions
        env:
          GH_TOKEN: ${{ secrets.SKILL_VAULT_TOKEN }}
        run: make skills-check

  # Preserve the existing aggregate check name while the expensive verification
  # work runs concurrently in the jobs above.
  test:
    if: ${{ always() }}
    needs: [static-fast, lint, dogfood, race, plugin, coverage, compatibility, skills]
    runs-on: ubuntu-latest
    steps:
      - name: Check verification results
        env:
          STATIC_FAST_RESULT: ${{ needs.static-fast.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DOGFOOD_RESULT: ${{ needs.dogfood.result }}
          RACE_RESULT: ${{ needs.race.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          SKILLS_RESULT: ${{ needs.skills.result }}
        run: |
          for result in "$STATIC_FAST_RESULT" "$LINT_RESULT" "$DOGFOOD_RESULT" "$RACE_RESULT" "$PLUGIN_RESULT" "$COVERAGE_RESULT" "$COMPATIBILITY_RESULT"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
          if [[ "$SKILLS_RESULT" != "success" && "$SKILLS_RESULT" != "skipped" ]]; then
            exit 1
          fi
