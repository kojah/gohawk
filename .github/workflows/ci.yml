name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify module files
        run: make mod-verify

      - name: Check formatting
        run: make fmt-check

      - name: Check generated documentation
        run: make generated-check

      - name: Test golangci-lint module plugin
        run: make plugin-test

      - name: Test and collect coverage
        # Measure product analysis behavior, not CLI and documentation tooling.
        run: make coverage

      - name: Generate coverage badge
        uses: tj-actions/coverage-badge-go@481919ec72da287775fef015fd9011dc75a5db05 # v3
        with:
          filename: coverage-summary.out
          link: https://github.com/kojah/gohawk/actions/workflows/ci.yml

      - name: Check coverage badge
        run: git diff --exit-code -- README.md

      - name: Test with race detector
        run: make test-race

      - name: Vet
        run: make vet

      - name: Build and dogfood gohawk
        run: make dogfood
