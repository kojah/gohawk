name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify module files
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check generated documentation
        run: go run ./internal/cmd/gendocs -check

      - name: Test and collect coverage
        run: |
          go test ./... -covermode=count -coverpkg=./... -coverprofile=coverage.out
          go tool cover -func=coverage.out -o=coverage-summary.out

      - name: Generate coverage badge
        uses: tj-actions/coverage-badge-go@481919ec72da287775fef015fd9011dc75a5db05 # v3
        with:
          filename: coverage-summary.out
          link: https://github.com/kojah/gohawk/actions/workflows/ci.yml

      - name: Check coverage badge
        run: git diff --exit-code -- README.md

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/gohawk" ./cmd/gohawk

      - name: Dogfood gohawk
        run: '"$RUNNER_TEMP/gohawk" ./...'
