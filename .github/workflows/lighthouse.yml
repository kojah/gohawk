name: Documentation Lighthouse

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "general/**"
      - "analyzers/**"
      - "go.mod"
      - "go.sum"
      - "tools/gendocs/**"
      - "Makefile"
      - ".github/workflows/lighthouse.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "general/**"
      - "analyzers/**"
      - "go.mod"
      - "go.sum"
      - "tools/gendocs/**"
      - "Makefile"
      - ".github/workflows/lighthouse.yml"
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PNPM: pnpm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: make site-install
      - run: make site-audit
      - name: Upload Lighthouse report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unlighthouse-local
          path: |
            site/.unlighthouse/ci-result.json
            site/.unlighthouse/reports/**/lighthouse.html
          if-no-files-found: warn
          retention-days: 14

  production:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PNPM: pnpm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: make site-install
      - run: make site-audit-production
      - name: Upload Lighthouse report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unlighthouse-production
          path: |
            site/.unlighthouse-production/ci-result.json
            site/.unlighthouse-production/reports/**/lighthouse.html
          if-no-files-found: warn
          retention-days: 14
