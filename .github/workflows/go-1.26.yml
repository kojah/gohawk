name: Go 1.26

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-1.26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Test with the minimum supported Go version
        env:
          GOTOOLCHAIN: local
        run: go test ./...
