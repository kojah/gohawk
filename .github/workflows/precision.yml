name: Precision regression

on:
  workflow_dispatch:
    inputs:
      cohort:
        description: Reviewed cohort to replay
        required: true
        default: round-3
        type: choice
        options: [round-2, round-3]

permissions:
  contents: read

jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Replay reviewed cohort
        run: scripts/precision-regression.py benchmarks/precision/${{ inputs.cohort }}
