name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag, such as v0.1.0
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from the main branch, not $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|1)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a valid v0 or v1 semantic version tag" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi

      - name: Verify module files
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check generated documentation
        run: go run ./internal/cmd/gendocs -check

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build and dogfood
        run: |
          go build -o "$RUNNER_TEMP/gohawk" .
          "$RUNNER_TEMP/gohawk" ./...

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          arguments=(
            "$VERSION"
            --target "$GITHUB_SHA"
            --title "gohawk $VERSION"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}"
