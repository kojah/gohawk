name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag, such as v0.1.0
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from the main branch, not $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|1)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a valid v0 or v1 semantic version tag" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          for attempt in {1..120}; do
            ci_run="$({
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci.yml \
                --branch main \
                --event push \
                --commit "$GITHUB_SHA" \
                --limit 1 \
                --json databaseId,status,conclusion \
                --jq 'if length == 0 then empty else .[0] | [.databaseId, .status, .conclusion] | @tsv end'
            } || true)"
            if [[ -n "$ci_run" ]]; then
              IFS=$'\t' read -r ci_run_id ci_status ci_conclusion <<< "$ci_run"
              if [[ "$ci_status" == "completed" ]]; then
                if [[ "$ci_conclusion" == "success" ]]; then
                  echo "CI run $ci_run_id passed for $GITHUB_SHA"
                  exit 0
                fi
                echo "CI run $ci_run_id concluded with $ci_conclusion" >&2
                exit 1
              fi
              echo "Waiting for CI run $ci_run_id ($ci_status)"
            else
              echo "Waiting for a CI push run for $GITHUB_SHA"
            fi
            sleep 10
          done
          echo "Timed out waiting for CI on $GITHUB_SHA" >&2
          exit 1

  # Native macOS and Windows tests run only here and on manual dispatch.
  platforms:
    needs: validate
    uses: ./.github/workflows/platforms.yml

  # So does the stress suite: pathological code under memory limits and a
  # time-boxed fuzz run of every analyzer.
  stress:
    needs: validate
    uses: ./.github/workflows/stress.yml

  binaries:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version }}
        run: |
          release_name="gohawk_${VERSION#v}_${GOOS}_${GOARCH}"
          staging="$RUNNER_TEMP/$release_name"
          binary="gohawk"
          if [[ "$GOOS" == "windows" ]]; then
            binary="gohawk.exe"
          fi

          mkdir -p dist "$staging"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X=github.com/kojah/gohawk/internal/cli.buildVersion=$VERSION" \
            -o "$staging/$binary" \
            .
          cp LICENSE README.md "$staging/"

          if [[ "$GOOS" == "windows" ]]; then
            (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/$release_name.zip" "$release_name")
          else
            tar -C "$RUNNER_TEMP" -czf "dist/$release_name.tar.gz" "$release_name"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # One editor extension package per platform, each carrying that platform's
  # gohawk binary, so an installed extension needs no download and its binary
  # always matches its version.
  extension:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # pnpm/action-setup owns the CI version; avoid re-entering it through Corepack.
      PNPM: pnpm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check and test the extension
        working-directory: editors/vscode
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test

      - name: Package the extension for each platform
        working-directory: editors/vscode
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          # The Marketplace accepts only major.minor.patch, so a prerelease
          # tag is dropped from the package version.
          extension_version="${version%%-*}"
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$unpacked" "$GITHUB_WORKSPACE/extension-dist"

          while read -r target goos goarch; do
            archive="gohawk_${version}_${goos}_${goarch}"
            if [[ "$goos" == "windows" ]]; then
              unzip -q "$GITHUB_WORKSPACE/dist/$archive.zip" -d "$unpacked"
              binary="$unpacked/$archive/gohawk.exe"
            else
              tar -xzf "$GITHUB_WORKSPACE/dist/$archive.tar.gz" -C "$unpacked"
              binary="$unpacked/$archive/gohawk"
            fi
            node scripts/package.mjs \
              --target "$target" \
              --binary "$binary" \
              --version "$extension_version" \
              --out "$GITHUB_WORKSPACE/extension-dist"
          done <<'TARGETS'
          linux-x64 linux amd64
          linux-arm64 linux arm64
          darwin-x64 darwin amd64
          darwin-arm64 darwin arm64
          win32-x64 windows amd64
          win32-arm64 windows arm64
          TARGETS

      - name: Upload extension packages
        uses: actions/upload-artifact@v7
        with:
          name: extension
          path: extension-dist/*.vsix
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [binaries, extension, platforms, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Download extension packages
        uses: actions/download-artifact@v8
        with:
          name: extension
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum gohawk_* gohawk-*.vsix > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          arguments=(
            "$VERSION"
            --target "$GITHUB_SHA"
            --title "gohawk $VERSION"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}" dist/*
